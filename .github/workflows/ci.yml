name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tsconfig.web.json
      - run: npx vitest run
      - run: npm run web
      - run: npx tsc -p tsconfig.build.json
      # deploy/aws 的 schema 校验前置（R1 P1#3 防回归）：SG description 含 `>`
      # 这类字符白名单违规，apply 前的 validate 就该挡住，不能等到部署日。
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deploy/aws init -backend=false
      - run: terraform -chdir=deploy/aws validate

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # PR 事件 ref_name=NN/merge 含 / 非法 Docker tag——PR 下出 pr-<N>，
          # push（限 main 与 v* tag，ref_name 均不含 /）原样用 ref_name。
          tags: |
            ghcr.io/juli-os/juli:latest
            ghcr.io/juli-os/juli:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
